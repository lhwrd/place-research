<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Place Research{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Place Research</a>
    <nav>
      {% set path = request.url.path %}
      <a href="/" {% if path == '/' or path.startswith('/properties') %}aria-current="page"{% endif %}>Properties</a>
      <a href="/locations" {% if path.startswith('/locations') %}aria-current="page"{% endif %}>Locations</a>
      <a href="/settings" {% if path.startswith('/settings') %}aria-current="page"{% endif %}>Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
