services:
  # Backend API (local development)
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: place-research-backend
    environment:
      # Baserow (source of truth for properties)
      BASEROW_URL: ${BASEROW_URL}
      BASEROW_API_TOKEN: ${BASEROW_API_TOKEN}
      BASEROW_DATABASE_ID: ${BASEROW_DATABASE_ID}
      BASEROW_PROPERTIES_TABLE_ID: ${BASEROW_PROPERTIES_TABLE_ID}
      BASEROW_LOCATIONS_TABLE_ID: ${BASEROW_LOCATIONS_TABLE_ID}
      BASEROW_SETTINGS_TABLE_ID: ${BASEROW_SETTINGS_TABLE_ID}
      BASEROW_WEBHOOK_SECRET: ${BASEROW_WEBHOOK_SECRET}

      # iOS Shortcut ingest token
      INGEST_API_TOKEN: ${INGEST_API_TOKEN}

      # External API Keys
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      NATIONAL_FLOOD_DATA_API_KEY: ${NATIONAL_FLOOD_DATA_API_KEY}
      WALKSCORE_API_KEY: ${WALKSCORE_API_KEY}
      AIRNOW_API_KEY: ${AIRNOW_API_KEY}

      # Application Settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      APP_NAME: ${APP_NAME:-Place Research}

      # File Paths
      RAILLINES_PATH: ${RAILLINES_PATH}
      ANNUAL_CLIMATE_PATH: ${ANNUAL_CLIMATE_PATH}

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    # Reached by the iOS Shortcut and Baserow's webhook (over Tailscale)
    ports:
      - "${BACKEND_PORT:-8000}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped
