# Local development. Deployment lives in howard-home.
services:
  backend:
    build: .
    container_name: place-research-backend
    # Same .env the app reads when run with uv (see .env.example)
    env_file: .env
    environment:
      # Data files are mounted at /app/data below
      RAILLINES_PATH: ${CONTAINER_RAILLINES_PATH:-/app/data/raillines.geojson}
      HIGHWAYS_PATH: ${CONTAINER_HIGHWAYS_PATH:-/app/data/highways.parquet}
      BROADBAND_PATH: ${CONTAINER_BROADBAND_PATH:-/app/data/broadband.parquet}
    volumes:
      - ./data:/app/data:ro
      # SQLite database (properties, photos, locations, settings): back this up
      - ./db:/app/db
      - ./logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
